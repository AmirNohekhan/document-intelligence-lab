[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "document-intelligence-lab"
version = "0.1.0"
description = "Evaluation-first document intelligence lab for insurance, financial, and legal decisions."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.scripts]
document-intelligence-lab = "document_intelligence_lab.app:main"

